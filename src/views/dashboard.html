<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h1 class="mb-4">Dashboard de Tareas</h1>

    <form id="formTarea" class="row g-3 mb-4">
      <div class="col-md-9">
        <input type="text" id="descripcion" class="form-control" placeholder="Descripción de la tarea" required>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-primary w-100">Agregar Tarea</button>
      </div>
    </form>

    <h3 class="mt-4">Tareas Pendientes</h3>
    <ul class="list-group mb-4" id="listaPendientes"></ul>

    <h3>Tareas Realizadas</h3>
    <ul class="list-group" id="listaRealizadas"></ul>
  </div>

  <script type="module">
    import { loadTasks, setupTaskForm } from './tasks.js';
    loadTasks();
    setupTaskForm();
  </script>
</body>
</html>
